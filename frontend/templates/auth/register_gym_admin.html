{% extends "base.html" %}
{% block title %}Register Gym{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}

{% block body %}
<div class="auth-page">
    <div class="auth-container wide">
        <div class="auth-logo">
            <a href="{{ url_for('public.landing') }}">
                <div class="auth-logo-icon">G</div>
                <div class="auth-logo-text">Gym<span>Desk</span></div>
            </a>
        </div>
        <div class="auth-card">
            <h2>Register Your Gym</h2>
            <p class="auth-subtitle">Create your account and register your fitness center</p>

            <form method="POST">
                <!-- Personal Details -->
                <div class="form-section-title">👤 Your Details</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+91-XXXXXXXXXX">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 6 characters"
                            required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password *</label>
                        <input type="password" name="confirm_password" class="form-control"
                            placeholder="Re-enter password" required>
                    </div>
                </div>

                <!-- Gym Details -->
                <div class="form-section">
                    <div class="form-section-title">🏢 Gym Details</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Gym Name *</label>
                            <input type="text" name="gym_name" class="form-control" placeholder="FitZone Gym" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gym Type</label>
                            <select name="gym_type" class="form-control">
                                <option value="general">General Fitness</option>
                                <option value="crossfit">CrossFit</option>
                                <option value="bodybuilding">Bodybuilding</option>
                                <option value="yoga">Yoga Studio</option>
                                <option value="martial_arts">Martial Arts</option>
                                <option value="personal_training">Personal Training</option>
                                <option value="sports">Sports Performance</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <input type="text" name="gym_address" class="form-control" placeholder="Street address">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <input type="text" name="gym_city" class="form-control" placeholder="Mumbai">
                        </div>
                        <div class="form-group">
                            <label class="form-label">State</label>
                            <input type="text" name="gym_state" class="form-control" placeholder="Maharashtra">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Pincode</label>
                            <input type="text" name="gym_pincode" class="form-control" placeholder="400001">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gym Phone</label>
                            <input type="tel" name="gym_phone" class="form-control" placeholder="+91-XXXXXXXXXX">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gym Email</label>
                        <input type="email" name="gym_email" class="form-control" placeholder="info@yourgym.com">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Opening Time</label>
                            <input type="time" name="opening_time" class="form-control" value="06:00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Closing Time</label>
                            <input type="time" name="closing_time" class="form-control" value="22:00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea name="gym_description" class="form-control" rows="3"
                            placeholder="Tell members about your gym..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg mt-4">Register Gym</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
